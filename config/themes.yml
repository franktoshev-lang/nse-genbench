# Theme inventory. Names and scope wording follow the NSE pipeline's
# src/config/themes.py so that generated corpora are drop-in compatible.
#
# probes  : bilingual keyword probes used to decide whether a generated
#           card surfaced this theme. NL + EN because the current prompt
#           forces English output while responses are Dutch.
#           KNOWN LIMITATION: keyword matching is fragile. It is used here
#           deliberately and documented, unlike insight_metrics.py in the
#           NSE repo which filters Dutch text with an English stopword list.
# templates: Dutch response templates. {slot} values come from `fillers`.

fillers:
  vak: ["Statistiek", "Onderzoeksvaardigheden", "Projectmanagement", "Databases", "Ethiek"]
  periode: ["periode 1", "het eerste blok", "semester 2", "de laatste periode"]
  duur: ["twee weken", "een maand", "zes weken", "bijna een heel blok"]
  docentrol: ["de docent", "een van de docenten", "de begeleider", "de coach"]

themes:
  - name: "Examination & Assessment"
    probes: ["toets", "tentamen", "beoordel", "feedback", "cijfer", "assessment", "exam", "grading", "marking", "rubric"]
    templates:
      - "De feedback op toetsen komt veel te laat, soms pas na {duur}."
      - "Beoordelingscriteria voor {vak} zijn onduidelijk; je weet niet waar je op beoordeeld wordt."
      - "Ik vind het vreemd dat je bij {vak} pas na {duur} je cijfer krijgt."
      - "De rubrics verschillen per docent, waardoor beoordeling willekeurig voelt."
      - "Toetsmomenten liggen allemaal in dezelfde week, dat is niet te plannen."
      - "Feedback is vaak alleen een cijfer zonder uitleg, daar leer ik niets van."

  - name: "Teachers"
    probes: ["docent", "leraar", "begeleider", "uitleg", "teacher", "lecturer", "instructor", "explanation"]
    templates:
      - "De docenten zijn erg betrokken maar reageren traag op mail."
      - "Sommige docenten hebben duidelijk geen ervaring in het werkveld."
      - "{docentrol} legt stof goed uit, maar gaat vaak te snel door de slides."
      - "Bij {vak} wisselde de docent halverwege {periode}, dat gaf veel onrust."
      - "Docenten zijn goed bereikbaar tijdens de les, daarbuiten niet."

  - name: "Content and Organisation"
    probes: ["inhoud", "curriculum", "organisatie", "rooster", "planning", "studiemateriaal", "content", "organisation", "schedule", "timetable", "workload", "material"]
    templates:
      - "Het rooster verandert te vaak, soms pas een dag vooraf."
      - "Er zit veel overlap tussen {vak} en de module erna."
      - "De studiebelasting is heel ongelijk verdeeld over {periode}."
      - "Het studiemateriaal voor {vak} is verouderd."
      - "De opbouw van het curriculum is niet logisch; je mist voorkennis."

  - name: "Support / Mentoring"
    probes: ["begeleiding", "studieloopbaan", "slb", "mentor", "ondersteuning", "support", "mentoring", "guidance", "counsel"]
    templates:
      - "Mijn studieloopbaanbegeleider heb ik in {periode} twee keer gezien."
      - "Er is weinig ondersteuning als je achterloopt."
      - "De begeleiding bij het kiezen van een minor was onduidelijk."
      - "Als je een probleem hebt weet je niet bij wie je moet zijn."

  - name: "Professional Practice"
    probes: ["stage", "werkveld", "beroepspraktijk", "praktijk", "bedrijf", "internship", "placement", "professional practice", "industry"]
    templates:
      - "De stagebegeleiding vanuit school was minimaal."
      - "Ik had meer opdrachten uit het echte werkveld verwacht."
      - "Gastlessen van bedrijven waren het beste onderdeel van {periode}."
      - "De link tussen {vak} en de beroepspraktijk is onduidelijk."

# Low-information responses. The NSE pipeline defines
# LOW_INFORMATION_THEME = "No Meaningful Response" but does NOT filter
# these before generation, so they must appear in the corpus.
noise:
  - "Prima"
  - "Goed"
  - "Niks"
  - "Geen opmerkingen"
  - "n.v.t."
  - "Alles goed zo"
  - "."

# ~10-15% of real NSE responses are English (international students).
english:
  - "Feedback on assignments usually arrives far too late to be useful."
  - "Some lecturers clearly have no recent industry experience."
  - "The timetable changes too often and is announced too late."
  - "I would have liked more contact with actual companies."
  - "Assessment criteria are not explained clearly anywhere."

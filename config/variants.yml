# Prompt variants for the generation benchmark.
#
# P0 is the group pipeline's prompt code, verbatim (genbench/prompts.py): the
# baseline control. Every other variant is P0 with the text edits listed under
# `replace` applied to that code, and changes exactly one `dimension`.
#
# Each edit is [old, new, count]: `old` must occur exactly `count` times in the
# baseline code, so an edit can never touch more places than declared.
# tests/test_variants.py checks this, and that a variant's rendered prompts
# equal P0's with the declared edits and nothing else. Variants added in the
# UI are written to this file.
#
# `base: P0-neutral` applies that variant's edits first, so the variant
# differs from its base in its own `dimension` only. `settings` change how the
# pipeline batches the responses or what the request asks for, never the
# prompt text: batch_documents, mode, response_format (genbench/variants.py).

variants:
  P0:
    dimension: none
    description: >
      The group pipeline's prompts at r-huijts/NSE_Applied_GenAI@6a48c37,
      unchanged, including the known defects. The baseline control.

  P0-neutral:
    dimension: model_name
    description: >
      Removes the three hardcoded "Gemma 4" labels (defect D-1), so a model is
      not told it is Gemma 4. Used for every comparison across models, and the
      base of every variant below.
    replace:
      - ["Gemma 4 task: act as", "Task: act as", 1]
      - ["Gemma 4 output rules:", "Output rules:", 1]
      - ["Gemma 4 response contract:", "Response contract:", 1]

  # Prompt-engineering research document (13 October 2026), section 4.6.
  # Temperature (P4) is not tested for now: every model runs at its default.

  P1-EN-NL:
    base: P0-neutral
    dimension: output_language
    description: >
      P1, instructions in English, output in Dutch. The analytical fields are
      written in Dutch instead of English; student suggestions stay verbatim.
      (The NL/NL cell needs a checked Dutch translation of the whole prompt.)
    replace:
      - ["write generated analytical fields in English", "write generated analytical fields in Dutch", 1]
      - ["concise English summaries", "concise Dutch summaries", 10]
      - ["concise English sentences", "concise Dutch sentences", 1]

  P2-batch-20:
    base: P0-neutral
    dimension: batch_size
    description: >
      P2, 20 responses per map batch instead of 60. Same prompt text; more,
      smaller map calls before the reduce step.
    settings:
      batch_documents: 20

  P2-batch-120:
    base: P0-neutral
    dimension: batch_size
    description: >
      P2, 120 responses per map batch instead of 60. On 60 responses this is
      the same single prompt as P0-neutral.
    settings:
      batch_documents: 120

  P2-single:
    base: P0-neutral
    dimension: batch_size
    description: >
      P2, every response (up to the 240 cap) in one single prompt, no map or
      reduce step. On 60 responses this is the same as P0-neutral.
    settings:
      mode: single

  P3-summary-last:
    base: P0-neutral
    dimension: schema_order
    description: >
      P3, the summary key moves from first to last in the JSON format, so the
      model writes its points and evidence before its overall verdict
      (defect D-2).
    replace:
      - ["{\n  \"summary\": \"...\",\n  \"positive_comments\"", "{\n  \"positive_comments\"", 1]
      - ["[\"E0001\", \"E0002\"]}\n  ]\n}", "[\"E0001\", \"E0002\"]}\n  ],\n  \"summary\": \"...\"\n}", 1]

  P10-schema:
    base: P0-neutral
    dimension: constrained_decoding
    description: >
      P10, constrained decoding on: the request asks the endpoint to force the
      answer into the card schema (response_format json_schema, strict). Same
      prompt text. All four Fontys models accepted the setting on 1 November 2026.
    settings:
      response_format: json_schema

  P1-NL-NL:
    base: P0-neutral
    dimension: prompt_language
    description: >
      P1, instructions in Dutch and output in Dutch. Every instruction the model reads
      is translated (by Claude, not yet checked by a Dutch reader). Left in English on
      purpose: the JSON keys (the parser needs them), the theme name, and 'batch 1 of 4'
      in the map prompt (the word sits between two placeholders).
    replace:
      - ["Task: act as a strict JSON-only analyst for an education survey dashboard.", "Taak: treed op als strikte analist die uitsluitend JSON teruggeeft, voor het dashboard van een onderwijsenquête.", 1]
      - ["Read the following student survey responses about '", "Lees de volgende antwoorden uit de studentenenquête over '", 1]
      - ["' and turn them into one dashboard insight.", "' en maak er één inzicht voor het dashboard van.", 1]
      - ["Theme scope: ", "Afbakening van het thema: ", 3]
      - ["Scope rules:", "Afbakeningsregels:", 1]
      - ["- Use only the supplied responses as evidence.", "- Gebruik alleen de aangeleverde antwoorden als bewijs.", 1]
      - ["- Only analyze comments as evidence for this selected theme.", "- Gebruik opmerkingen alleen als bewijs voor dit gekozen thema.", 1]
      - ["- Ignore irrelevant parts of multi-topic responses.", "- Negeer delen van antwoorden over meerdere onderwerpen die niet relevant zijn.", 1]
      - ["- Do not infer facts, demographics, causes, or details that are not present in the responses.", "- Leid geen feiten, demografische gegevens, oorzaken of details af die niet in de antwoorden staan.", 1]
      - ["These responses may be the complete theme evidence set or one small enough to fit in a single prompt.", "Deze antwoorden kunnen alle antwoorden voor dit thema zijn, of een set die klein genoeg is voor één prompt.", 1]
      - ["Generation tasks:", "Taken:", 1]
      - ["1. Summarize the general consensus in exactly 2 concise English sentences.", "1. Vat de algemene consensus samen in precies 2 beknopte Nederlandse zinnen.", 1]
      - ["Write up to 3 concise English summaries of the strongest positive points students make", "Schrijf maximaal 3 beknopte Nederlandse samenvattingen van de sterkste positieve punten die studenten noemen", 4]
      - ["Write up to 3 concise English summaries of the strongest critical points students make", "Schrijf maximaal 3 beknopte Nederlandse samenvattingen van de sterkste kritische punten die studenten noemen", 4]
      - ["4. Select up to 3 exact student suggestions where students propose a solution, improvement, or concrete next step instead of only complaining.", "4. Kies maximaal 3 letterlijke suggesties van studenten waarin zij een oplossing, verbetering of concrete volgende stap voorstellen, in plaats van alleen te klagen.", 1]
      - ["5. Extract 3 to 5 short subthemes or topics mentioned within the selected theme.", "5. Haal 3 tot 5 korte subthema's of onderwerpen uit de antwoorden die binnen het gekozen thema worden genoemd.", 1]
      - ["Respond EXACTLY in this JSON format:", "Antwoord PRECIES in dit JSON-formaat:", 6]
      - ["Responses:", "Antwoorden:", 4]
      - ["Output rules: write generated analytical fields in English ", "Uitvoerregels: schrijf de gegenereerde analytische velden in het Nederlands (summary, positive_comments, critical_comments, subthemes en de beschrijvingen in het manifest). Schrijf positive_comments en critical_comments als beknopte, samengevatte punten, niet als citaten. Neem alleen student_suggestions op als letterlijke opmerkingen van studenten in hun oorspronkelijke taal.", 1]
      - ["(summary, positive_comments, critical_comments, subthemes, and manifest ", "", 1]
      - ["descriptions). Write positive_comments and critical_comments as concise ", "", 1]
      - ["synthesized points, not as quotes. Keep only student_suggestions as exact ", "", 1]
      - ["verbatim student comments in their original language.", "", 1]
      - ["Subtheme task: extract 3 to 5 short, dashboard-friendly subthemes that are ", "Subthema-taak: haal 3 tot 5 korte subthema's uit de antwoorden die geschikt zijn voor een dashboard, specifiek zijn voor het gekozen thema en door de antwoorden worden ondersteund. Geef voor elk subthema ook een subtheme_manifest-item met dezelfde naam, een beschrijving van één zin, en evidence_ids die exact zijn overgenomen van de antwoord-ID's tussen haakjes, zoals E0001. Gebruik alleen ID's die dat subthema direct ondersteunen. Verzin, hernoem of herformatteer geen evidence-ID's.", 1]
      - ["specific to the selected theme and supported by the responses. For every ", "", 1]
      - ["subtheme, also return a subtheme_manifest entry with the same name, a ", "", 1]
      - ["one-sentence description, and evidence_ids copied exactly from the response ", "", 1]
      - ["IDs shown in brackets, such as E0001. Use only IDs that directly support ", "", 1]
      - ["that subtheme. Do not invent, rename, or reformat evidence IDs.", "", 1]
      - ["Response contract: return one valid JSON object only. Do not wrap ", "Antwoordcontract: geef uitsluitend één geldig JSON-object terug. Zet het antwoord niet in Markdown, codeblokken, XML-tags, analysetekst of redeneringen. Gebruik precies de schemasleutels hieronder en voeg geen extra sleutels toe. Als er voor een veld geen onderbouwing in de antwoorden is, geef dan een lege lijst voor lijstvelden of een korte, op de antwoorden gebaseerde tekst voor summary.", 1]
      - ["the answer in Markdown, code fences, XML tags, analysis text, or reasoning. ", "", 1]
      - ["Use exactly the schema keys shown below; do not add extra keys. If a field ", "", 1]
      - ["has no supported evidence, return an empty array for list fields or a ", "", 1]
      - ["short evidence-bounded summary string for summary.", "", 1]
      - ["Definite evidence:", "Antwoorden die duidelijk bij het thema horen:", 1]
      - ["Ambiguous candidate evidence:", "Twijfelachtige kandidaat-antwoorden:", 1]
      - ["These responses were close classification candidates for this theme. ", "Deze antwoorden kwamen bij de indeling dicht bij dit thema. Negeer kandidaat-antwoorden die niet echt relevant zijn. Een antwoord dat echt over meerdere onderwerpen gaat, mag bijdragen aan deze samenvatting.", 1]
      - ["Ignore any candidate evidence that is not genuinely relevant. A genuinely ", "", 1]
      - ["multi-topic response may contribute to this summary.", "", 1]
      - ["You are analyzing batch ", "Je analyseert batch ", 2]
      - [" for the survey theme ", " voor het enquêtethema ", 1]
      - ["Only analyze comments as evidence for this theme. Ignore parts of answers that ", "Gebruik opmerkingen alleen als bewijs voor dit thema. Negeer delen van antwoorden die duidelijk bij een ander thema horen.", 1]
      - ["clearly belong to another theme.", "", 1]
      - ["This is an intermediate map step, not the final theme summary. Summarize only this batch without making whole-theme prevalence claims.", "Dit is een tussenstap per batch, niet de eindsamenvatting van het thema. Vat alleen deze batch samen en doe geen uitspraken over hoe vaak iets in het hele thema voorkomt.", 1]
      - ["Preserve concrete student suggestions as verbatim comments. Write positive_comments and critical_comments as concise English summaries, not quotes.", "Bewaar concrete suggesties van studenten als letterlijke opmerkingen. Schrijf positive_comments en critical_comments als beknopte Nederlandse samenvattingen, niet als citaten.", 2]
      - ["For subthemes, include evidence IDs from this batch only.", "Gebruik bij subthema's alleen evidence-ID's uit deze batch.", 1]
      - ["You are an expert data analyst. Merge the batch-level survey insights for '", "Je bent een deskundige data-analist. Voeg de enquête-inzichten per batch voor '", 1]
      - ["' into one final dashboard insight.", "' samen tot één definitief inzicht voor het dashboard.", 1]
      - ["The batch summaries together represent ", "De batchsamenvattingen zijn samen gebaseerd op ", 2]
      - [" source student responses.", " oorspronkelijke antwoorden van studenten.", 2]
      - ["Only make claims supported by repeated or strong evidence in the batch summaries. Do not invent quotes or details.", "Doe alleen uitspraken die worden ondersteund door herhaald of sterk bewijs in de batchsamenvattingen. Verzin geen citaten of details.", 2]
      - ["Summarize the general consensus in 2 sentences.", "Vat de algemene consensus samen in 2 Nederlandse zinnen.", 1]
      - ["Do not present these as verbatim quotes.", "Presenteer deze niet als letterlijke citaten.", 3]
      - ["Select up to 3 exact student suggestions from the batch summaries. Use verbatim text only; return an empty array if no clear suggestions exist.", "Kies maximaal 3 letterlijke suggesties van studenten uit de batchsamenvattingen. Gebruik alleen letterlijke tekst; geef een lege lijst als er geen duidelijke suggesties zijn.", 2]
      - ["Deduplicate repeated points across batches. Prefer patterns that appear in multiple batches, but keep a strong minority concern if it is concrete and important.", "Voeg punten die in meerdere batches terugkomen samen. Geef de voorkeur aan patronen die in meerdere batches voorkomen, maar behoud een sterk punt van een minderheid als het concreet en belangrijk is.", 2]
      - ["Also extract 3 to 5 short sub-themes or topics mentioned across the batch summaries.", "Haal ook 3 tot 5 korte subthema's of onderwerpen uit de batchsamenvattingen.", 1]
      - ["Merge subtheme_manifest entries from the batch summaries. Preserve evidence_ids from the batch summaries and deduplicate them.", "Voeg de subtheme_manifest-items uit de batchsamenvattingen samen. Behoud de evidence_ids uit de batchsamenvattingen en verwijder dubbele.", 1]
      - ["Batch summaries:", "Batchsamenvattingen:", 2]
      - ["Comments about how students' knowledge, understanding, and skills are examined, assessed, ", "Opmerkingen over hoe de kennis, het inzicht en de vaardigheden van studenten worden getoetst, beoordeeld of becijferd. Dit omvat de aansluiting tussen toetsen en de inhoud die in de opleiding is onderwezen, de duidelijkheid en consistentie van beoordelingscriteria, rubrics, instructies en prestatie-eisen, en de kwaliteit en moeilijkheid van theoretische en praktische tentamens. Het omvat ook de geschiktheid van toetsvormen zoals schriftelijke tentamens, presentaties, projecten, portfolio's, verslagen en praktische demonstraties. Feedback binnen dit thema gaat over feedback op opdrachten, tentamens, verslagen of ander beoordeeld werk, inclusief of die duidelijk, bruikbaar en tijdig is en studenten helpt hun prestaties te begrijpen en te verbeteren.", 1]
      - ["judged, or graded. This includes the alignment between assessments and the content taught ", "", 1]
      - ["in the programme, the clarity and consistency of assessment criteria, rubrics, instructions, ", "", 1]
      - ["and performance expectations, and the quality and difficulty of theoretical and practical ", "", 1]
      - ["examinations. It also includes the suitability of assessment methods such as written exams, ", "", 1]
      - ["presentations, projects, portfolios, reports, and practical demonstrations. Feedback in this ", "", 1]
      - ["theme refers to feedback on assignments, examinations, reports, or other assessed work, ", "", 1]
      - ["including whether it is clear, useful, timely, and helps students understand their performance ", "", 1]
      - ["and how to improve it.", "", 1]

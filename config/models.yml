# Decoding settings. The repo overrides its own 0.1 default to 1.0 on all
# five models; that override is variant P4, not a given.
decoding:
  repo_default:   { temperature: 1.0, top_p: 0.95, top_k: 64, enable_thinking: true }
  low_variance:   { temperature: 0.3, top_p: 0.95, top_k: 64, enable_thinking: false }
  deterministic:  { temperature: 0.1, top_p: 0.95, top_k: 64, enable_thinking: false }

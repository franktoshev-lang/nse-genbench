# The four models under test (final, 27 October 2026). The endpoints are
# supplied by the university. run.py --model <key> uses the settings below;
# the endpoint itself (MODEL_BASE_URL, MODEL_API_KEY) comes from .env.
#
#   model_id           the exact id the endpoint expects. Filled in with the
#                      vendor's id where one is known; replace it if the
#                      university endpoint uses another name.
#   temperature        false: never send a temperature (the model rejects it)
#   token_limit_param  the field name this model accepts for the output limit
#
# Reasoning: every model runs at its provider's default for now (decided
# 27 October 2026, provisional). Reasoning tokens are recorded per run.

models:
  gemma-4-12b:
    name: Gemma 4 12B
    role: baseline, what the group pipeline deploys
    model_id: ""            # no standard id; take it from the university
    temperature: true
    token_limit_param: max_tokens

  gemma-4-31b:
    name: Gemma 4 31B
    role: larger model from the same family
    model_id: ""            # no standard id; take it from the university
    temperature: true
    token_limit_param: max_tokens

  claude-opus-5-5:
    name: Claude Opus 5.5
    role: frontier model, Anthropic
    model_id: claude-opus-5-5
    temperature: true
    token_limit_param: max_tokens

  gpt-6-astra:
    name: GPT-6 Astra
    role: frontier model, OpenAI
    model_id: gpt-6-astra
    # OpenAI's docs (checked 19 October 2026): Astra cannot set reasoning
    # effort to "none", and temperature must be removed while reasoning is on.
    temperature: false
    # Third-party reports say OpenAI reasoning models reject max_tokens and
    # want max_completion_tokens. Confirm with the first test call.
    token_limit_param: max_completion_tokens
